# kitty configuration
#
# Font zoom shortcuts: Ctrl+Plus = zoom in, Ctrl+Minus = zoom out, Ctrl+0 = reset.
# kitty's built-in defaults only bind Ctrl+Shift+= / Ctrl+Shift+- (kitty_mod),
# so these add the plain Ctrl variants on every keyboard layout.

# Zoom in: + key, = key, Shift+= (US layout) and numpad +
map ctrl+plus        change_font_size all +2.0
map ctrl+equal       change_font_size all +2.0
map ctrl+shift+equal change_font_size all +2.0
map ctrl+kp_add      change_font_size all +2.0

# Zoom out: - key, Shift+- (_) and numpad -
map ctrl+minus       change_font_size all -2.0
map ctrl+underscore  change_font_size all -2.0
map ctrl+shift+minus change_font_size all -2.0
map ctrl+kp_subtract change_font_size all -2.0

# Reset to the default font size
map ctrl+0    change_font_size all 0
map ctrl+kp_0 change_font_size all 0


font_family      MesloLGS NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

cursor                #ff5ca8
cursor_text_color     #16151f
cursor_shape          block
cursor_blink_interval 0

foreground            #e4e4e7
background            #16151f
background_opacity    0.95
dynamic_background_opacity yes

selection_foreground  #ffffff
selection_background  #7f3fbf

url_color             #8be9fd
url_style             curly

color0  #22212c
color8  #6272a4

color1  #ff5555
color9  #ff6e6e

color2  #50fa7b
color10 #69ff94

color3  #f1fa8c
color11 #ffffa5

color4  #7f3fbf
color12 #9f5fe2

color5  #ea4394
color13 #ff5ca8

color6  #8be9fd
color14 #a4ffff

color7  #f8f8f2
color15 #ffffff

active_tab_foreground   #ffffff
active_tab_background   #7f3fbf
inactive_tab_foreground #6272a4
inactive_tab_background #16151f
tab_bar_style           powerline
